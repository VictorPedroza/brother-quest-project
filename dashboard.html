<!doctype html>
<html lang="PT-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brother Quest - Dashboard</title>
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <header class="dashboard-nav">
      <div class="dashboard-nav__content">
        <a
          class="brand"
          href="/dashboard.html"
          aria-label="BrotherQuest, painel inicial"
        >
          <span class="brand__mark" aria-hidden="true">
          </span>
          <span>Brother<span>Quest</span></span>
        </a>
        <div class="user-menu">
          <div class="user-menu__details">
            <span class="user-menu__name">Claudio</span
            ><span class="user-menu__level">Nível 1</span>
          </div>
          <span class="user-menu__avatar" aria-label="Perfil de Claudio"
            >CL</span
          >
          <button class="logout-button" type="button" aria-label="Sair">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M14 8l4 4-4 4M18 12H9M11 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h5"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="dashboard">
      <section class="level-card" aria-labelledby="current-level">
        <div class="level-card__top">
          <div>
            <p class="eyebrow">NÍVEL ATUAL</p>
            <h1 class="level-card__title" id="current-level">Nível 1</h1>
          </div>
          <div class="level-card__xp">
            <p class="eyebrow">PRÓXIMO NÍVEL</p>
            <p class="level-card__xp-value">0 <span>/ 500 XP</span></p>
          </div>
        </div>
        <div
          class="progress"
          role="progressbar"
          aria-label="Progresso para o próximo nível"
          aria-valuenow="0"
          aria-valuemin="0"
          aria-valuemax="500"
        >
          <span class="progress__fill"></span>
        </div>
        <p class="level-card__hint">
          Faltam <strong>500 <span>XP</span></strong> para o próximo nível!
        </p>
      </section>

      <section class="metrics" aria-label="Resumo diário">
        <article class="metric">
          <span class="metric__icon metric__icon--flame" aria-hidden="true"
            ><svg viewBox="0 0 24 24" fill="none">
              <path
                d="M13 2c1 4-1 5-1 7 0 1.1.9 2 2 2 1.7 0 2.5-1.8 2-4 3 2 5 5.1 5 8.5a9 9 0 1 1-18 0c0-2.5 1.2-5 4-7.5-.2 2.5.6 4 2.2 4.5C10.8 9.4 12.2 6.7 13 2Z"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              /></svg
          ></span>
          <div class="metric__content">
            <p class="metric__label">STREAK ATUAL</p>
            <p class="metric__value">0 dias</p>
          </div>
        </article>
        <article class="metric">
          <span class="metric__icon metric__icon--sparkle" aria-hidden="true"
            ><svg viewBox="0 0 24 24" fill="none">
              <path
                d="M12 2l1.3 5.7L19 9l-5.7 1.3L12 16l-1.3-5.7L5 9l5.7-1.3L12 2ZM19 14l.7 2.3L22 17l-2.3.7L19 20l-.7-2.3L16 17l2.3-.7L19 14ZM5 15l.8 3.2L9 19l-3.2.8L5 23l-.8-3.2L1 19l3.2-.8L5 15Z"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linejoin="round"
              /></svg
          ></span>
          <div class="metric__content">
            <p class="metric__label">XP TOTAL</p>
            <p class="metric__value">0 XP</p>
          </div>
        </article>
        <article class="metric">
          <span class="metric__icon metric__icon--check" aria-hidden="true"
            ><svg viewBox="0 0 24 24" fill="none">
              <circle
                cx="12"
                cy="12"
                r="8.5"
                stroke="currentColor"
                stroke-width="1.7"
              />
              <path
                d="m8.5 12 2.2 2.2 4.8-4.8"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              /></svg
          ></span>
          <div class="metric__content">
            <p class="metric__label">CONCLUÍDAS HOJE</p>
            <p class="metric__value">0/11</p>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
